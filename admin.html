<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>申請審核</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Big+Shoulders+Stencil+Display:wght@900&family=Noto+Sans+TC:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=20261010042700">
<link rel="stylesheet" href="admin.css?v=20261010042700">
</head>
<body>
<main class="wrap wide">
  <div class="admin-top">
    <h1 id="heading" data-i18n="title">申請審核</h1>
    <select id="lang" aria-label="Language">
      <option value="zh-TW">繁體中文</option>
      <option value="en">English</option>
        <option value="ko">한국어</option>
        <option value="ar">العربية</option>
    </select>
  </div>

  <form id="login" class="panel login" hidden>
    <label><span data-i18n="account">帳號</span> <input name="email" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" data-i18n-placeholder="accountHint" required></label>
    <label><span data-i18n="password">密碼</span> <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" data-i18n="login">登入</button>
    <div class="msg" id="loginMsg"></div>
  </form>

  <section id="app" hidden>
    <div class="toolbar">
      <span id="who"></span>
      <select id="fStatus">
        <option value="" data-i18n="allStatus">全部狀態</option>
        <option value="pending" data-i18n="status.pending" selected>待審</option>
        <option value="approved" data-i18n="status.approved">通過</option>
        <option value="rejected" data-i18n="status.rejected">拒絕</option>
      </select>
      <select id="fClan"><option value="" data-i18n="allClans">全部聯盟</option></select>
      <select id="sort">
        <option value="power" data-i18n="sortPower">總戰力（高到低）</option>
        <option value="new" data-i18n="sortNew">最新提交</option>
        <option value="old" data-i18n="sortOld">最早提交</option>
      </select>
      <input id="q" type="search" data-i18n-placeholder="search" placeholder="搜尋名稱 / ID / 推薦人">
      <button class="secondary" id="reload" type="button" data-i18n="reload">重新整理</button>
      <button class="secondary" id="export" type="button" data-i18n="export">匯出 CSV</button>
      <button class="secondary" id="logout" type="button" data-i18n="logout">登出</button>
    </div>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </section>
  <div class="msg" id="msg"></div>
</main>
<dialog id="viewer"><img id="viewerImg" alt=""><button class="secondary" id="viewerClose" type="button" data-i18n="close">關閉</button></dialog>
<script type="module" src="js/admin.js?v=20261010042700"></script>
</body>
</html>
