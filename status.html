<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>申請狀態查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Big+Shoulders+Stencil+Display:wght@900&family=Noto+Sans+TC:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=20261010042700">
</head>
<body>
<header class="page-head">
  <div class="photo-bg"><img src="assets/factory.webp" alt=""></div>
  <div class="wrap">
    <div class="topbar">
      <a href="index.html" id="back"></a>
      <nav class="lang-switch" id="lang" aria-label="Language">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
        <button type="button" data-lang="zh-TW" lang="zh-Hant">繁中</button>
        <button type="button" data-lang="en" lang="en">English</button>
        <button type="button" data-lang="ko" lang="ko">한국어</button>
        <button type="button" data-lang="ar" lang="ar">العربية</button>
      </nav>
    </div>
    <div class="page-title"><small>STATE</small><span id="stateNo"></span></div>
    <h1 class="page-sub" id="title"></h1>
    <p class="lead" id="intro"></p>
  </div>
</header>
<main class="form-wrap">
  <form id="form" class="panel lookup" novalidate>
    <div class="grid">
      <label><span id="lUser"></span><input name="username" id="username" maxlength="40" autocomplete="nickname" required></label>
      <label><span id="lId"></span><input name="game_id" id="game_id" maxlength="30" inputmode="numeric" required></label>
    </div>
    <button class="submit block" id="submit" type="submit"></button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div id="results" aria-live="polite"></div>
  </form>
</main>
<script type="module" src="js/status.js?v=20261010042700"></script>
</body>
</html>
